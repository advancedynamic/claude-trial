spring:
  application:
    name: secure-app

  datasource:
    url: jdbc:h2:file:./data/secureapp;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
        trace: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        use_sql_comments: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration/h2
    schemas: PUBLIC
    out-of-order: true

  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8

  mail:
    host: localhost
    port: 1025
    username:
    password:
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on-param
    include-exception: false

logging:
  level:
    root: INFO
    co.id.abcd.secure: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.flywaydb: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,h2-console
  endpoint:
    health:
      show-details: always

app:
  security:
    jwt-secret: LocalDevelopmentSecretKeyForTestingOnly
    token-expiration: 86400000 # 24 hours
    magic-link-expiration: 3600000 # 1 hour
    password-reset-expiration: 3600000 # 1 hour

  base-url: http://localhost:8080
