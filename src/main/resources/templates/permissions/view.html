<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>View Permission - Secure App</title><link rel="stylesheet" th:href="@{/css/output.css}"></head>
<body class="app-container">
<aside class="app-sidebar">
    <div class="sidebar-header"><h1 class="sidebar-brand">Secure App</h1></div>
    <nav class="sidebar-nav">
        <a th:href="@{/dashboard}" class="sidebar-item">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            Dashboard
        </a>
        <a th:href="@{/users}" sec:authorize="hasAnyRole('ADMIN', 'USER_MANAGER')" class="sidebar-item">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
            Users
        </a>
        <a th:href="@{/roles}" sec:authorize="hasRole('ADMIN')" class="sidebar-item">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
            Roles
        </a>
        <a th:href="@{/permissions}" sec:authorize="hasRole('ADMIN')" class="sidebar-item active">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            Permissions
        </a>
    </nav>
    <div class="sidebar-footer">
        <div class="user-menu">
            <div class="user-avatar"><span sec:authentication="name" th:text="${#authentication.name.substring(0,2).toUpperCase()}">JD</span></div>
            <div class="user-info"><div class="user-name" sec:authentication="name">User</div><div class="user-role">Admin</div></div>
        </div>
        <form th:action="@{/auth/logout}" method="post" class="mt-2">
            <button type="submit" class="btn btn-secondary w-full btn-sm">Logout</button>
        </form>
    </div>
</aside>
<div class="app-main"><header class="app-header"><h2 class="text-lg font-semibold">View Permission</h2>
<div class="flex gap-3"><a th:href="@{/permissions}" class="btn btn-secondary">Back</a><a th:href="@{/permissions/{id}/edit(id=${permission.id})}" class="btn btn-primary">Edit</a>
<form th:action="@{/permissions/{id}/delete(id=${permission.id})}" method="post" onsubmit="return confirm('Delete?');"><button type="submit" class="btn btn-danger">Delete</button></form></div></header>
<main class="app-content"><div class="page-header"><h1 class="page-title">Permission Details</h1><p class="page-subtitle">View permission information</p></div>
<div class="card"><div class="p-6"><h3 class="text-lg font-semibold mb-4">Basic Information</h3>
<div class="grid grid-cols-2 gap-6"><div><dt class="text-sm font-medium text-gray-500">ID</dt><dd class="mt-1 text-sm" th:text="${permission.id}">1</dd></div>
<div><dt class="text-sm font-medium text-gray-500">Name</dt><dd class="mt-1 text-sm font-medium" th:text="${permission.name}">READ</dd></div>
<div class="col-span-2"><dt class="text-sm font-medium text-gray-500">Description</dt><dd class="mt-1 text-sm" th:text="${permission.description}">Description</dd></div></div></div></div></main></div></body></html>
