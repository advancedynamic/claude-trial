<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Secure App</title>
    <link rel="stylesheet" th:href="@{/css/output.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-primary-50 to-secondary-100 min-h-screen flex items-center justify-center">
<div class="w-full max-w-md px-4">
    <div class="text-center mb-8">
        <h1 class="text-4xl font-bold text-primary-600 mb-2">Secure App</h1>
        <p class="text-gray-600">Sign in to your account</p>
    </div>

    <div th:if="${success}" class="alert alert-success mb-4">
        <p th:text="${success}"></p>
    </div>
    <div th:if="${error}" class="alert alert-error mb-4">
        <p th:text="${error}"></p>
    </div>
    <div th:if="${message}" class="alert alert-info mb-4">
        <p th:text="${message}"></p>
    </div>

    <div class="card card-hover">
        <h2 class="text-2xl font-bold text-gray-900 mb-6">Sign In</h2>

        <form th:action="@{/auth/login}" method="post" class="space-y-4">
            <div>
                <label for="username" class="form-label">Username or Email</label>
                <input type="text" id="username" name="username" required
                       class="form-input" placeholder="Enter your username or email">
            </div>

            <div>
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" required
                       class="form-input" placeholder="Enter your password">
            </div>

            <div class="flex items-center justify-between">
                <div class="flex items-center">
                    <input type="checkbox" id="remember-me" name="remember-me"
                           class="h-4 w-4 text-primary-600 focus:ring-primary-500 border-gray-300 rounded">
                    <label for="remember-me" class="ml-2 block text-sm text-gray-700">
                        Remember me
                    </label>
                </div>

                <div class="text-sm">
                    <a th:href="@{/auth/forgot-password}" class="font-medium text-primary-600 hover:text-primary-500">
                        Forgot password?
                    </a>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-full">
                Sign In
            </button>
        </form>

        <div class="mt-6">
            <div class="relative">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-gray-300"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span class="px-2 bg-white text-gray-500">Or</span>
                </div>
            </div>

            <div class="mt-6 space-y-3">
                <a th:href="@{/auth/request-magic-link}" class="btn btn-outline w-full">
                    Sign in with Magic Link
                </a>
            </div>
        </div>

        <div class="mt-6 text-center">
            <p class="text-sm text-gray-600">
                Don't have an account?
                <a th:href="@{/auth/register}" class="font-medium text-primary-600 hover:text-primary-500">
                    Register here
                </a>
            </p>
        </div>
    </div>

    <div class="text-center mt-6">
        <p class="text-sm text-gray-600">&copy; 2025 Secure App. All rights reserved.</p>
    </div>
</div>
</body>
</html>
