<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Secure App</title>
    <link rel="stylesheet" th:href="@{/css/output.css}">
</head>
<body class="auth-container">
    <div class="auth-card">
        <!-- Header -->
        <div class="auth-header">
            <h1 class="auth-logo">Secure App</h1>
            <h2 class="auth-title">Create your account</h2>
            <p class="auth-subtitle">Get started with your new account</p>
        </div>

        <!-- Alerts -->
        <div th:if="${success}" class="alert alert-success mb-4">
            <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
            <span th:text="${success}"></span>
        </div>

        <!-- Register Form -->
        <form th:action="@{/auth/register}" th:object="${user}" method="post" class="space-y-4">
            <!-- Name Fields -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="form-group">
                    <label for="firstName" class="form-label">First Name</label>
                    <input type="text" id="firstName" th:field="*{firstName}"
                           class="form-input" placeholder="John" autocomplete="given-name">
                </div>
                <div class="form-group">
                    <label for="lastName" class="form-label">Last Name</label>
                    <input type="text" id="lastName" th:field="*{lastName}"
                           class="form-input" placeholder="Doe" autocomplete="family-name">
                </div>
            </div>

            <!-- Username Field -->
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" th:field="*{username}" required
                       class="form-input" placeholder="johndoe" autocomplete="username">
                <p th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="text-red-600 text-sm mt-1"></p>
            </div>

            <!-- Email Field -->
            <div class="form-group">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" th:field="*{email}" required
                       class="form-input" placeholder="john@example.com" autocomplete="email">
                <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-red-600 text-sm mt-1"></p>
            </div>

            <!-- Phone Field -->
            <div class="form-group">
                <label for="phone" class="form-label">Phone (Optional)</label>
                <input type="tel" id="phone" th:field="*{phone}"
                       class="form-input" placeholder="+1 (555) 123-4567" autocomplete="tel">
            </div>

            <!-- Password Fields -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" th:field="*{password}" required
                           class="form-input" placeholder="Minimum 8 characters" autocomplete="new-password">
                    <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-red-600 text-sm mt-1"></p>
                </div>
                <div class="form-group">
                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}" required
                           class="form-input" placeholder="Re-enter password" autocomplete="new-password">
                    <p th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="text-red-600 text-sm mt-1"></p>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-full">Create Account</button>
        </form>

        <!-- Footer -->
        <div class="auth-footer">
            Already have an account? <a th:href="@{/auth/login}" class="auth-link">Sign in</a>
        </div>
    </div>
</body>
</html>
