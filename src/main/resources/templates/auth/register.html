<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Secure App</title>
    <link rel="stylesheet" th:href="@{/css/output.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-primary-50 to-secondary-100 min-h-screen flex items-center justify-center">
<div class="w-full max-w-md px-4">
    <div class="text-center mb-8">
        <h1 class="text-4xl font-bold text-primary-600 mb-2">Secure App</h1>
        <p class="text-gray-600">Create your account</p>
    </div>

    <div th:if="${success}" class="alert alert-success mb-4">
        <p th:text="${success}"></p>
    </div>

    <div class="card card-hover">
        <h2 class="text-2xl font-bold text-gray-900 mb-6">Register</h2>

        <form th:action="@{/auth/register}" th:object="${user}" method="post" class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label for="firstName" class="form-label">First Name</label>
                    <input type="text" id="firstName" th:field="*{firstName}"
                           class="form-input" placeholder="John">
                </div>
                <div>
                    <label for="lastName" class="form-label">Last Name</label>
                    <input type="text" id="lastName" th:field="*{lastName}"
                           class="form-input" placeholder="Doe">
                </div>
            </div>

            <div>
                <label for="username" class="form-label">Username *</label>
                <input type="text" id="username" th:field="*{username}" required
                       class="form-input" placeholder="johndoe">
                <p th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="form-error"></p>
            </div>

            <div>
                <label for="email" class="form-label">Email *</label>
                <input type="email" id="email" th:field="*{email}" required
                       class="form-input" placeholder="john@example.com">
                <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="form-error"></p>
            </div>

            <div>
                <label for="phone" class="form-label">Phone</label>
                <input type="tel" id="phone" th:field="*{phone}"
                       class="form-input" placeholder="+1234567890">
            </div>

            <div>
                <label for="password" class="form-label">Password *</label>
                <input type="password" id="password" th:field="*{password}" required
                       class="form-input" placeholder="Minimum 8 characters">
                <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="form-error"></p>
            </div>

            <div>
                <label for="confirmPassword" class="form-label">Confirm Password *</label>
                <input type="password" id="confirmPassword" th:field="*{confirmPassword}" required
                       class="form-input" placeholder="Re-enter password">
                <p th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="form-error"></p>
            </div>

            <button type="submit" class="btn btn-primary w-full">
                Create Account
            </button>
        </form>

        <div class="mt-6 text-center">
            <p class="text-sm text-gray-600">
                Already have an account?
                <a th:href="@{/auth/login}" class="font-medium text-primary-600 hover:text-primary-500">
                    Sign in here
                </a>
            </p>
        </div>
    </div>

    <div class="text-center mt-6">
        <p class="text-sm text-gray-600">&copy; 2025 Secure App. All rights reserved.</p>
    </div>
</div>
</body>
</html>
