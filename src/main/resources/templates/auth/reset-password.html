<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Secure App</title>
    <link rel="stylesheet" th:href="@{/css/output.css}">
</head>
<body class="auth-container">
    <div class="auth-card">
        <!-- Header -->
        <div class="auth-header">
            <h1 class="auth-logo">Secure App</h1>
            <h2 class="auth-title">Reset your password</h2>
            <p class="auth-subtitle">Enter your new password below</p>
        </div>

        <!-- Reset Password Form -->
        <form th:action="@{/auth/reset-password}" th:object="${resetDto}" method="post" class="space-y-4">
            <input type="hidden" th:field="*{token}">

            <div class="form-group">
                <label for="password" class="form-label">New Password</label>
                <input type="password" id="password" th:field="*{password}" required
                       class="form-input" placeholder="Enter new password" autocomplete="new-password">
                <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-red-600 text-sm mt-1"></p>
            </div>

            <div class="form-group">
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <input type="password" id="confirmPassword" th:field="*{confirmPassword}" required
                       class="form-input" placeholder="Confirm new password" autocomplete="new-password">
                <p th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="text-red-600 text-sm mt-1"></p>
            </div>

            <button type="submit" class="btn btn-primary w-full">Reset Password</button>
        </form>

        <!-- Footer -->
        <div class="auth-footer">
            <a th:href="@{/auth/login}" class="auth-link">Back to Login</a>
        </div>
    </div>
</body>
</html>
