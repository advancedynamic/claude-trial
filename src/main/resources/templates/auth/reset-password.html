<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Secure App</title>
    <link rel="stylesheet" th:href="@{/css/output.css}">
</head>
<body class="bg-gradient-to-br from-gray-50 via-primary-50 to-gray-100 min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-md animate-fade-in">
    <!-- Brand Header -->
    <div class="text-center mb-8">
        <h1 class="text-4xl font-display font-bold bg-gradient-primary bg-clip-text text-transparent mb-2">Secure App</h1>
        <p class="text-gray-600 text-base">Create a new password for your account</p>
    </div>

    <!-- Reset Password Card -->
    <div class="card shadow-xl">
        <div class="card-body p-8">
            <div class="text-center mb-6">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-success-100 rounded-full mb-4">
                    <svg class="w-8 h-8 text-success-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                    </svg>
                </div>
                <h2 class="card-title text-2xl">Reset Your Password</h2>
                <p class="text-sm text-muted mt-2">Please enter your new password below</p>
            </div>

            <form th:action="@{/auth/reset-password}" th:object="${resetDto}" method="post" class="space-y-5">
                <input type="hidden" th:field="*{token}">

                <div class="form-group">
                    <label for="password" class="form-label form-label-required">New Password</label>
                    <input type="password" id="password" th:field="*{password}" required
                           class="form-input" placeholder="Enter new password" autocomplete="new-password">
                    <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="form-error"></p>
                    <p class="form-help">Must be at least 8 characters long</p>
                </div>

                <div class="form-group">
                    <label for="confirmPassword" class="form-label form-label-required">Confirm Password</label>
                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}" required
                           class="form-input" placeholder="Confirm new password" autocomplete="new-password">
                    <p th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="form-error"></p>
                </div>

                <button type="submit" class="btn btn-primary w-full btn-lg">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                    </svg>
                    Reset Password
                </button>
            </form>

            <div class="mt-6 text-center">
                <a th:href="@{/auth/login}" class="link text-sm inline-flex items-center gap-1">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                    </svg>
                    Back to Login
                </a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="text-center mt-6">
        <p class="text-sm text-muted">&copy; 2025 Secure App. All rights reserved.</p>
    </div>
</div>
</body>
</html>
