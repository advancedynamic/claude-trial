<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reset Password - Secure App</title>
    <link rel="stylesheet" th:href="@{/css/output.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-primary-50 to-secondary-100 min-h-screen flex items-center justify-center">
<div class="w-full max-w-md px-4">
    <div class="text-center mb-8">
        <h1 class="text-4xl font-bold text-primary-600 mb-2">Secure App</h1>
        <p class="text-gray-600">Set new password</p>
    </div>

    <div class="card card-hover">
        <h2 class="text-2xl font-bold text-gray-900 mb-6">Reset Password</h2>
        <form th:action="@{/auth/reset-password}" th:object="${resetDto}" method="post" class="space-y-4">
            <input type="hidden" th:field="*{token}">
            <div>
                <label for="password" class="form-label">New Password</label>
                <input type="password" id="password" th:field="*{password}" required class="form-input">
                <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="form-error"></p>
            </div>
            <div>
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <input type="password" id="confirmPassword" th:field="*{confirmPassword}" required class="form-input">
                <p th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="form-error"></p>
            </div>
            <button type="submit" class="btn btn-primary w-full">Reset Password</button>
        </form>
    </div>
</div>
</body>
</html>
