<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password - Secure App</title>
    <link rel="stylesheet" th:href="@{/css/output.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-primary-50 to-secondary-100 min-h-screen flex items-center justify-center">
<div class="w-full max-w-md px-4">
    <div class="text-center mb-8">
        <h1 class="text-4xl font-bold text-primary-600 mb-2">Secure App</h1>
        <p class="text-gray-600">Reset your password</p>
    </div>

    <div th:if="${success}" class="alert alert-success mb-4"><p th:text="${success}"></p></div>

    <div class="card card-hover">
        <h2 class="text-2xl font-bold text-gray-900 mb-6">Forgot Password</h2>
        <form th:action="@{/auth/forgot-password}" th:object="${resetRequest}" method="post" class="space-y-4">
            <div>
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" th:field="*{email}" required class="form-input">
                <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="form-error"></p>
            </div>
            <button type="submit" class="btn btn-primary w-full">Send Reset Link</button>
        </form>
        <div class="mt-4 text-center">
            <a th:href="@{/auth/login}" class="text-sm text-primary-600 hover:text-primary-500">Back to Login</a>
        </div>
    </div>
</div>
</body>
</html>
