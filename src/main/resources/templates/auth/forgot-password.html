<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Secure App</title>
    <link rel="stylesheet" th:href="@{/css/output.css}">
</head>
<body class="bg-gradient-to-br from-gray-50 via-primary-50 to-gray-100 min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-md animate-fade-in">
    <!-- Brand Header -->
    <div class="text-center mb-8">
        <h1 class="text-4xl font-display font-bold bg-gradient-primary bg-clip-text text-transparent mb-2">Secure App</h1>
        <p class="text-gray-600 text-base">Reset your password via email</p>
    </div>

    <!-- Success Alert -->
    <div th:if="${success}" class="alert alert-success mb-4 animate-slide-down">
        <svg class="alert-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
        </svg>
        <div>
            <h3 class="alert-title">Success</h3>
            <p th:text="${success}"></p>
        </div>
    </div>

    <!-- Forgot Password Card -->
    <div class="card shadow-xl">
        <div class="card-body p-8">
            <div class="text-center mb-6">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-primary-100 rounded-full mb-4">
                    <svg class="w-8 h-8 text-primary-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path>
                    </svg>
                </div>
                <h2 class="card-title text-2xl">Forgot Password?</h2>
                <p class="text-sm text-muted mt-2">No worries, we'll send you reset instructions.</p>
            </div>

            <form th:action="@{/auth/forgot-password}" th:object="${resetRequest}" method="post" class="space-y-5">
                <div class="form-group">
                    <label for="email" class="form-label form-label-required">Email Address</label>
                    <input type="email" id="email" th:field="*{email}" required
                           class="form-input" placeholder="Enter your email" autocomplete="email">
                    <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="form-error"></p>
                    <p class="form-help">Enter the email address associated with your account</p>
                </div>

                <button type="submit" class="btn btn-primary w-full btn-lg">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                    </svg>
                    Send Reset Link
                </button>
            </form>

            <div class="mt-6 text-center">
                <a th:href="@{/auth/login}" class="link text-sm inline-flex items-center gap-1">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                    </svg>
                    Back to Login
                </a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="text-center mt-6">
        <p class="text-sm text-muted">&copy; 2025 Secure App. All rights reserved.</p>
    </div>
</div>
</body>
</html>
