<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Link - Secure App</title>
    <link rel="stylesheet" th:href="@{/css/output.css}">
</head>
<body class="auth-container">
    <div class="auth-card">
        <!-- Header -->
        <div class="auth-header">
            <h1 class="auth-logo">Secure App</h1>
            <h2 class="auth-title">Magic Link Login</h2>
            <p class="auth-subtitle">Sign in without a password</p>
        </div>

        <!-- Alerts -->
        <div th:if="${success}" class="alert alert-success mb-4">
            <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
            <span th:text="${success}"></span>
        </div>

        <div th:if="${info}" class="alert alert-info mb-4">
            <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <span th:text="${info}"></span>
        </div>

        <!-- Magic Link Form -->
        <form th:action="@{/auth/request-magic-link}" th:object="${magicLinkRequest}" method="post" class="space-y-4">
            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" id="email" th:field="*{email}" required
                       class="form-input" placeholder="Enter your email" autocomplete="email">
                <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-red-600 text-sm mt-1"></p>
            </div>

            <button type="submit" class="btn btn-primary w-full">Send Magic Link</button>
        </form>

        <!-- Footer -->
        <div class="auth-footer">
            <a th:href="@{/auth/login}" class="auth-link">Back to Login</a>
        </div>
    </div>
</body>
</html>
