<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Create User - Secure App</title>
    <link rel="stylesheet" th:href="@{/css/output.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50">
<nav class="bg-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16">
            <div class="flex">
                <div class="flex-shrink-0 flex items-center">
                    <a th:href="@{/dashboard}" class="text-2xl font-bold text-primary-600">Secure App</a>
                </div>
                <div class="hidden sm:ml-6 sm:flex sm:space-x-4">
                    <a th:href="@{/dashboard}" class="inline-flex items-center px-3 py-2 text-sm font-medium text-gray-700 hover:text-primary-600 border-b-2 border-transparent">Dashboard</a>
                    <a th:href="@{/users}" sec:authorize="hasAnyRole('ADMIN', 'USER_MANAGER')" class="inline-flex items-center px-3 py-2 text-sm font-medium text-primary-600 border-b-2 border-primary-600">Users</a>
                    <a th:href="@{/roles}" sec:authorize="hasRole('ADMIN')" class="inline-flex items-center px-3 py-2 text-sm font-medium text-gray-700 hover:text-primary-600 border-b-2 border-transparent">Roles</a>
                    <a th:href="@{/permissions}" sec:authorize="hasRole('ADMIN')" class="inline-flex items-center px-3 py-2 text-sm font-medium text-gray-700 hover:text-primary-600 border-b-2 border-transparent">Permissions</a>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <span class="text-sm text-gray-700">Welcome, <span class="font-medium" sec:authentication="name">User</span></span>
                <form th:action="@{/auth/logout}" method="post" class="inline">
                    <button type="submit" class="btn btn-outline text-sm">Logout</button>
                </form>
            </div>
        </div>
    </div>
</nav>

<main class="max-w-4xl mx-auto py-6 sm:px-6 lg:px-8">
    <div class="px-4 py-6 sm:px-0">
        <div class="mb-6">
            <a th:href="@{/users}" class="text-primary-600 hover:text-primary-700 flex items-center">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                </svg>
                Back to Users
            </a>
        </div>

        <h1 class="text-3xl font-bold text-gray-900 mb-6">Create New User</h1>

        <div class="card">
            <form th:action="@{/users/create}" th:object="${user}" method="post">
                <div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
                    <!-- Username -->
                    <div>
                        <label for="username" class="form-label">Username <span class="text-error-600">*</span></label>
                        <input type="text"
                               id="username"
                               th:field="*{username}"
                               class="form-input"
                               th:classappend="${#fields.hasErrors('username')} ? 'border-error-500' : ''"
                               required>
                        <p th:if="${#fields.hasErrors('username')}"
                           th:errors="*{username}"
                           class="mt-1 text-sm text-error-600"></p>
                    </div>

                    <!-- Email -->
                    <div>
                        <label for="email" class="form-label">Email <span class="text-error-600">*</span></label>
                        <input type="email"
                               id="email"
                               th:field="*{email}"
                               class="form-input"
                               th:classappend="${#fields.hasErrors('email')} ? 'border-error-500' : ''"
                               required>
                        <p th:if="${#fields.hasErrors('email')}"
                           th:errors="*{email}"
                           class="mt-1 text-sm text-error-600"></p>
                    </div>

                    <!-- Password -->
                    <div>
                        <label for="password" class="form-label">Password <span class="text-error-600">*</span></label>
                        <input type="password"
                               id="password"
                               th:field="*{password}"
                               class="form-input"
                               th:classappend="${#fields.hasErrors('password')} ? 'border-error-500' : ''"
                               required>
                        <p th:if="${#fields.hasErrors('password')}"
                           th:errors="*{password}"
                           class="mt-1 text-sm text-error-600"></p>
                    </div>

                    <!-- Phone -->
                    <div>
                        <label for="phone" class="form-label">Phone</label>
                        <input type="tel"
                               id="phone"
                               th:field="*{phone}"
                               class="form-input"
                               placeholder="+1234567890">
                    </div>

                    <!-- First Name -->
                    <div>
                        <label for="firstName" class="form-label">First Name</label>
                        <input type="text"
                               id="firstName"
                               th:field="*{firstName}"
                               class="form-input">
                    </div>

                    <!-- Last Name -->
                    <div>
                        <label for="lastName" class="form-label">Last Name</label>
                        <input type="text"
                               id="lastName"
                               th:field="*{lastName}"
                               class="form-input">
                    </div>
                </div>

                <!-- Roles Section -->
                <div class="mt-6">
                    <label class="form-label">Roles</label>
                    <div class="mt-2 space-y-2">
                        <div th:each="role : ${allRoles}" class="flex items-center">
                            <input type="checkbox"
                                   th:id="'role-' + ${role.id}"
                                   name="roleIds"
                                   th:value="${role.id}"
                                   class="h-4 w-4 text-primary-600 focus:ring-primary-500 border-gray-300 rounded">
                            <label th:for="'role-' + ${role.id}" class="ml-3 block text-sm text-gray-700">
                                <span th:text="${role.name}" class="font-medium">ADMIN</span>
                                <span th:if="${role.description}" th:text="' - ' + ${role.description}" class="text-gray-500"></span>
                            </label>
                        </div>
                        <p th:if="${#lists.isEmpty(allRoles)}" class="text-sm text-gray-500">
                            No roles available. Please create roles first.
                        </p>
                    </div>
                </div>

                <!-- Account Status -->
                <div class="mt-6">
                    <div class="flex items-center">
                        <input type="checkbox"
                               id="enabled"
                               th:field="*{enabled}"
                               class="h-4 w-4 text-primary-600 focus:ring-primary-500 border-gray-300 rounded">
                        <label for="enabled" class="ml-3 block text-sm text-gray-700">
                            Account Enabled
                        </label>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="mt-6 flex justify-end gap-3">
                    <a th:href="@{/users}" class="btn btn-outline">Cancel</a>
                    <button type="submit" class="btn btn-primary">Create User</button>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
