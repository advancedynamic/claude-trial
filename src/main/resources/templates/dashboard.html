<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Secure App</title>
    <link rel="stylesheet" th:href="@{/css/output.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50">
<nav class="bg-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16">
            <div class="flex">
                <div class="flex-shrink-0 flex items-center">
                    <a th:href="@{/dashboard}" class="text-2xl font-bold text-primary-600">Secure App</a>
                </div>
                <div class="hidden sm:ml-6 sm:flex sm:space-x-4">
                    <a th:href="@{/dashboard}" class="inline-flex items-center px-3 py-2 text-sm font-medium text-primary-600 border-b-2 border-primary-600">Dashboard</a>
                    <a th:href="@{/users}" sec:authorize="hasAnyRole('ADMIN', 'USER_MANAGER')" class="inline-flex items-center px-3 py-2 text-sm font-medium text-gray-700 hover:text-primary-600 border-b-2 border-transparent">Users</a>
                    <a th:href="@{/roles}" sec:authorize="hasRole('ADMIN')" class="inline-flex items-center px-3 py-2 text-sm font-medium text-gray-700 hover:text-primary-600 border-b-2 border-transparent">Roles</a>
                    <a th:href="@{/permissions}" sec:authorize="hasRole('ADMIN')" class="inline-flex items-center px-3 py-2 text-sm font-medium text-gray-700 hover:text-primary-600 border-b-2 border-transparent">Permissions</a>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <span class="text-sm text-gray-700">Welcome, <span class="font-medium" sec:authentication="name">User</span></span>
                <form th:action="@{/auth/logout}" method="post" class="inline">
                    <button type="submit" class="btn btn-outline text-sm">Logout</button>
                </form>
            </div>
        </div>
    </div>
</nav>

<main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
    <div th:if="${success}" class="alert alert-success mb-4"><p th:text="${success}"></p></div>

    <div class="px-4 py-6 sm:px-0">
        <h1 class="text-3xl font-bold text-gray-900 mb-6">Dashboard</h1>

        <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
            <div class="card card-hover" sec:authorize="hasAnyRole('ADMIN', 'USER_MANAGER')">
                <div class="flex items-center">
                    <div class="flex-shrink-0 bg-primary-100 rounded-md p-3">
                        <svg class="h-6 w-6 text-primary-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>
                        </svg>
                    </div>
                    <div class="ml-5 w-0 flex-1">
                        <dl>
                            <dt class="text-sm font-medium text-gray-500 truncate">Manage Users</dt>
                            <dd class="mt-1 text-3xl font-semibold text-gray-900"><a th:href="@{/users}" class="text-primary-600 hover:text-primary-700">Go</a></dd>
                        </dl>
                    </div>
                </div>
            </div>

            <div class="card card-hover" sec:authorize="hasRole('ADMIN')">
                <div class="flex items-center">
                    <div class="flex-shrink-0 bg-success-100 rounded-md p-3">
                        <svg class="h-6 w-6 text-success-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                        </svg>
                    </div>
                    <div class="ml-5 w-0 flex-1">
                        <dl>
                            <dt class="text-sm font-medium text-gray-500 truncate">Manage Roles</dt>
                            <dd class="mt-1 text-3xl font-semibold text-gray-900"><a th:href="@{/roles}" class="text-success-600 hover:text-success-700">Go</a></dd>
                        </dl>
                    </div>
                </div>
            </div>

            <div class="card card-hover" sec:authorize="hasRole('ADMIN')">
                <div class="flex items-center">
                    <div class="flex-shrink-0 bg-warning-100 rounded-md p-3">
                        <svg class="h-6 w-6 text-warning-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                        </svg>
                    </div>
                    <div class="ml-5 w-0 flex-1">
                        <dl>
                            <dt class="text-sm font-medium text-gray-500 truncate">Manage Permissions</dt>
                            <dd class="mt-1 text-3xl font-semibold text-gray-900"><a th:href="@{/permissions}" class="text-warning-600 hover:text-warning-700">Go</a></dd>
                        </dl>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
